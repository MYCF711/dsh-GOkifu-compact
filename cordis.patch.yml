# dsh-chess-context · bundle patch
#
# 装包：`dsh plugin --profile <name> add dsh-chess-context`
#   → 追加进 profile 的 `dsh.profile.bundles`，并把下面的行 insert 进组合。
#
# ⚠ 单实例硬规则：压缩后端只能有一个。
#   本行挂上后必须让 `@deepseek-ai/dsh-compaction-basic` 不再注册 `ctx.compaction`。
#   实测那份实例常常不在「顶层」，而是嵌在 **agent preset 的 group** 里
#   （`home/preset-bundles/*/cordis.patch.yml` → `- id: compaction / group: true /
#   config: [{ id: compaction-basic, ... }]`），patch 索引不到组内行
#   ⇒ 必须直接改 preset 文件本身（`test/install.mjs` 会做这件事，带备份）。
#
# 配置项含义见 README.md；默认值按「1M 窗口、growth-gated」调过。
- insert:
    - id: chess-context
      name: 'dsh-chess-context'
      config:
        # 压力闸：min(窗口 × 0.45, 窗口 − 输出预留 − 64K)
        thresholdRatio: 0.45
        headroomTokens: 65536
        # 逐字保留的近期尾部
        retainRatio: 0.16
        # 增长闸：距上次 fold 至少新增这么多 token 才再次 fold
        growthFloorTokens: 40000
        # 被遮蔽内容少于这么多 token 不值得压
        minFoldTokens: 8000
        # hybrid = 规则事实 + 一次模型润色；rules = 零模型调用
        summaryMode: hybrid
        # 推荐用 ima 免费模型做 fold（实测 3/3 次 8/8 死路、2/2 约束）
        summarizationProvider: magpie
        summarizationModel: ima/deepseek-v4.1-flash
        maxTokens: 3072   # 中文摘要 ~1200 字；2048 会把末尾的死路截掉（实测）
        # 每步注入失败清单（热上下文）
        hotLedger: true
        hotLedgerMaxTokens: 500
        # 失败边标记：semantic（默认；`[blocked:permission]` + 按用到的标记动态生成图例）
        #            terse（只写三态，省 token）/ off（不打标记）
        hotLedgerMarkers: semantic
        # 置换检测：同一状态再次到达时不新建节点
        transposition: true
        auto: true
